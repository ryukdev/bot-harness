<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif">
  <rect width="820" height="470" rx="14" fill="#0d0d0f"/>
  <rect x="0" y="0" width="820" height="46" fill="#141416"/>
  <text x="22" y="29" fill="#e8e6e1" font-size="14" font-weight="600">Session rotate</text>
  <rect x="140" y="16" width="66" height="20" rx="6" fill="#26262a"/><text x="173" y="30" fill="#8a8a90" font-size="11.5" text-anchor="middle">vmlabs</text>
  <!-- user 1 -->
  <rect x="580" y="72" width="218" height="34" rx="10" fill="#26262a"/><text x="602" y="94" fill="#e8e6e1" font-size="14.5">what's your session id?</text>
  <!-- agent 1 -->
  <text x="34" y="140" fill="#6f6f76" font-size="13.5">Session status ›</text>
  <text x="34" y="166" fill="#e8e6e1" font-size="15.5" font-weight="600">session 15291c09 · <tspan fill="#e0a458">memory used: ~14k of 200k (7% full)</tspan></text>
  <!-- user 2 -->
  <rect x="596" y="196" width="202" height="34" rx="10" fill="#26262a"/><text x="618" y="218" fill="#e8e6e1" font-size="14.5">rotate to a new session</text>
  <!-- agent 2 -->
  <text x="34" y="264" fill="#6f6f76" font-size="13.5">Rotate session in place ›</text>
  <text x="34" y="290" fill="#e8e6e1" font-size="15.5"><tspan fill="#9ece6a" font-weight="600">✓ </tspan>context refreshed — same chat, work carried over</text>
  <text x="34" y="316" fill="#e8e6e1" font-size="15.5">memory used: <tspan font-weight="600">14k → 0.7k</tspan> <tspan fill="#9ece6a" font-weight="600">(95% freed)</tspan></text>
  <text x="34" y="342" fill="#6f6f76" font-size="14">reconnecting…</text>
  <!-- footer -->
  <text x="34" y="404" fill="#e8e6e1" font-size="15">same session id · fresh memory · nothing lost</text>
  <text x="34" y="440" fill="#5a5a60" font-size="13" font-style="italic">the id doesn't move — it's the same thread. only the memory under it was swapped fresh.</text>
</svg>
