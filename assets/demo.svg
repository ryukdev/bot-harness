<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
  <rect width="760" height="460" rx="12" fill="#16161e"/>
  <rect width="760" height="40" rx="12" fill="#1f2029"/><rect y="28" width="760" height="12" fill="#1f2029"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/><circle cx="46" cy="20" r="6" fill="#ffbd2e"/><circle cx="68" cy="20" r="6" fill="#27c93f"/>
  <text x="380" y="25" fill="#6a6f87" font-size="13" text-anchor="middle">bot-harness — one chat, many accounts, fresh memory</text>
  <text font-size="15" xml:space="preserve">
    <tspan x="24" y="78" fill="#565f89">you:</tspan><tspan fill="#c0caf5"> which account are you on?</tspan>
    <tspan x="24" y="104" fill="#9ece6a">→</tspan><tspan fill="#c0caf5"> you@personal.com</tspan>
    <tspan x="24" y="146" fill="#565f89">you:</tspan><tspan fill="#c0caf5"> switch to work</tspan>
    <tspan x="24" y="172" fill="#9ece6a">→</tspan><tspan fill="#c0caf5"> you@work.com</tspan><tspan fill="#565f89">  · brief auto-reconnect…</tspan>
    <tspan x="24" y="198" fill="#565f89">you:</tspan><tspan fill="#c0caf5"> check</tspan>
    <tspan x="24" y="224" fill="#9ece6a">✓</tspan><tspan fill="#c0caf5"> you@work.com</tspan><tspan fill="#565f89">   same chat, new account</tspan>
    <tspan x="24" y="266" fill="#565f89">you:</tspan><tspan fill="#c0caf5"> what's your session id?</tspan>
    <tspan x="24" y="292" fill="#9ece6a">→</tspan><tspan fill="#c0caf5"> session 15291c09 · memory used: ~14k of 200k (7% full)</tspan>
    <tspan x="24" y="334" fill="#565f89">you:</tspan><tspan fill="#c0caf5"> rotate to a new session</tspan>
    <tspan x="24" y="360" fill="#9ece6a">✓</tspan><tspan fill="#c0caf5"> context refreshed — same chat, work carried over</tspan>
    <tspan x="44" y="386" fill="#c0caf5">memory used: 14k → 0.7k</tspan><tspan fill="#9ece6a"> (95% freed)</tspan>
    <tspan x="24" y="424" fill="#565f89">same chat · new account · fresh memory · zero logins</tspan>
  </text>
</svg>
