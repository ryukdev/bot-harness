<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif">
  <rect width="820" height="500" rx="14" fill="#0d0d0f"/>
  <rect x="0" y="0" width="820" height="46" fill="#141416"/>
  <text x="22" y="29" fill="#e8e6e1" font-size="14" font-weight="600">Account switch</text>
  <rect x="150" y="16" width="66" height="20" rx="6" fill="#26262a"/><text x="183" y="30" fill="#8a8a90" font-size="11.5" text-anchor="middle">vmlabs</text>
  <!-- user 1 -->
  <rect x="560" y="72" width="238" height="34" rx="10" fill="#26262a"/><text x="582" y="94" fill="#e8e6e1" font-size="14.5">which account are you on?</text>
  <!-- agent 1 -->
  <text x="34" y="140" fill="#6f6f76" font-size="13.5">Checked current account ›</text>
  <text x="34" y="166" fill="#e8e6e1" font-size="15.5" font-weight="600">you@work.com</text>
  <!-- user 2 -->
  <rect x="638" y="196" width="160" height="34" rx="10" fill="#26262a"/><text x="660" y="218" fill="#e8e6e1" font-size="14.5">switch to personal</text>
  <!-- agent 2 -->
  <text x="34" y="264" fill="#6f6f76" font-size="13.5">Switched account ›</text>
  <text x="34" y="290" fill="#e8e6e1" font-size="15.5"><tspan fill="#9ece6a" font-weight="600">→ </tspan><tspan font-weight="600">you@personal.com</tspan><tspan fill="#6f6f76"> · reconnecting…</tspan></text>
  <!-- user 3 -->
  <rect x="720" y="320" width="78" height="34" rx="10" fill="#26262a"/><text x="742" y="342" fill="#e8e6e1" font-size="14.5">check</text>
  <!-- agent 3 -->
  <text x="34" y="388" fill="#6f6f76" font-size="13.5">Checked current account ›</text>
  <text x="34" y="414" fill="#e8e6e1" font-size="15.5"><tspan fill="#9ece6a" font-weight="600">✓ </tspan><tspan font-weight="600">you@personal.com</tspan></text>
  <text x="34" y="462" fill="#5a5a60" font-size="13" font-style="italic">same chat · new account · zero logins</text>
</svg>
