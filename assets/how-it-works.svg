<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif">
  <style>.b{fill:none;stroke:#8b8fa3;stroke-width:1.4;rx:10}.t{fill:#e8632b;font-weight:600;font-size:15px}.s{fill:#8b8fa3;font-size:12.5px}.a{stroke:#8b8fa3;stroke-width:1.4;fill:none;marker-end:url(#h)}</style>
  <defs><marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#8b8fa3" stroke-width="1.4"/></marker></defs>
  <rect class="b" x="20" y="60" width="210" height="80" rx="10"/>
  <text class="t" x="38" y="92">1 · you hit a limit</text><text class="s" x="38" y="114">your account has no</text><text class="s" x="38" y="132">headroom on your model</text>
  <line class="a" x1="230" y1="100" x2="268" y2="100"/>
  <rect class="b" x="276" y="60" width="210" height="80" rx="10"/>
  <text class="t" x="294" y="92">2 · bot-harness seat</text><text class="s" x="294" y="114">probes your accounts,</text><text class="s" x="294" y="132">picks one with headroom</text>
  <line class="a" x1="486" y1="100" x2="524" y2="100"/>
  <rect class="b" x="532" y="60" width="210" height="80" rx="10" stroke="#e8632b"/>
  <text class="t" x="550" y="92">3 · same thread</text><text class="s" x="550" y="114">resumes on the healthy</text><text class="s" x="550" y="132">account — keep typing</text>
  <text class="s" x="20" y="176">the conversation is just a file — it does not care which account pays. bot-harness re-opens it on a healthy one.</text>
</svg>
