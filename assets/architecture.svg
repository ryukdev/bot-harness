<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif">
  <style>.h{font-weight:600;font-size:14px}.s{fill:#8b8fa3;font-size:12px}.box{fill:none;stroke-width:1.3;rx:8}</style>
  <defs><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#8b8fa3" stroke-width="1.3"/></marker></defs>
  <rect x="16" y="16" width="728" height="150" rx="10" fill="none" stroke="#8b8fa3" stroke-width="1.3"/>
  <text class="h" x="34" y="42" fill="#1d9e75">THE CORE — standalone, enables Claude Code desktop (no extras needed)</text>
  <rect class="box" x="34" y="60" width="150" height="56" stroke="#8b8fa3"/><text class="h" x="48" y="84" fill="#c0501f">your accounts</text><text class="s" x="48" y="102">email + token pool</text>
  <line x1="184" y1="88" x2="212" y2="88" stroke="#8b8fa3" stroke-width="1.3" marker-end="url(#a2)"/>
  <rect class="box" x="220" y="60" width="150" height="56" stroke="#8b8fa3"/><text class="h" x="234" y="84" fill="#c0501f">router + prober</text><text class="s" x="234" y="102">pick a healthy one</text>
  <line x1="370" y1="88" x2="398" y2="88" stroke="#8b8fa3" stroke-width="1.3" marker-end="url(#a2)"/>
  <rect class="box" x="406" y="60" width="150" height="56" stroke="#e8632b" stroke-width="1.6"/><text class="h" x="420" y="84" fill="#c0501f">seat + app shim</text><text class="s" x="420" y="102">resume, same thread</text>
  <line x1="556" y1="88" x2="584" y2="88" stroke="#8b8fa3" stroke-width="1.3" marker-end="url(#a2)"/>
  <rect class="box" x="592" y="60" width="140" height="56" stroke="#1d9e75"/><text class="h" x="606" y="84" fill="#1d9e75">your thread</text><text class="s" x="606" y="102">keeps going ✓</text>
  <text class="s" x="34" y="146">the desktop app injects its own token at spawn — the shim swaps in your chosen seat before the real CLI starts</text>
  <rect x="16" y="184" width="728" height="52" rx="8" fill="none" stroke="#8b8fa3" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text class="h" x="34" y="208" fill="#8b8fa3">ADDON — serve outputs on your own tailnet (optional)</text><text class="s" x="34" y="226">present → click a local link · absent → a local file. never required.</text>
  <rect x="16" y="254" width="728" height="88" rx="8" fill="none" stroke="#7c6bd6" stroke-width="1.4"/>
  <text class="h" x="34" y="280" fill="#7c6bd6">THE HOOK → sharingu (the upgrade, not a requirement)</text>
  <text class="s" x="34" y="302">bot-harness switches at process birth — one reconnect per swap, and mobile drops.</text>
  <text class="s" x="34" y="322">sharingu's thread lives in a database: seats + sessions rotate WHILE YOU TYPE, on any phone browser, no reconnect.</text>
</svg>
